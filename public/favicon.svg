<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="144" fill="url(#bgGrad)" />

  <!-- CSV Grid Representation -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Column 1 (Representing Cells) -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#accentGrad)" />
    <rect x="0" y="110" width="80" height="80" rx="18" fill="#ffffff" opacity="0.9" />
    <rect x="0" y="220" width="80" height="80" rx="18" fill="#ffffff" opacity="0.6" />

    <!-- Column 2 -->
    <rect x="110" y="0" width="80" height="80" rx="18" fill="#ffffff" opacity="0.9" />
    <rect x="110" y="110" width="80" height="80" rx="18" fill="url(#accentGrad)" />
    <rect x="110" y="220" width="80" height="80" rx="18" fill="#ffffff" opacity="0.9" />

    <!-- Column 3 -->
    <rect x="220" y="0" width="80" height="80" rx="18" fill="#ffffff" opacity="0.6" />
    <rect x="220" y="110" width="80" height="80" rx="18" fill="#ffffff" opacity="0.9" />
    <rect x="220" y="220" width="80" height="80" rx="18" fill="url(#accentGrad)" />
  </g>

  <!-- Overlay Wrench / Tool Detail in Bottom-Right -->
  <path d="M 390 390 C 375 375 350 375 335 390 L 320 405 C 315 410 315 420 320 425 C 325 430 335 430 340 425 L 355 410 C 362 403 372 403 379 410 L 410 441 C 417 448 417 458 410 465 L 405 470 C 398 477 388 477 381 470 L 350 439 C 343 432 333 432 326 439 L 320 445 C 315 450 315 460 320 465 C 325 470 335 470 340 465 L 346 459 C 361 444 386 444 401 459 L 439 421 C 448 412 448 398 439 389 Z" fill="#ffffff" filter="url(#glow)" transform="translate(-30, -30)" />
</svg>
